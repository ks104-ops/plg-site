name: Site check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pages match the source in .github/site/build.mjs
        run: |
          node .github/site/build.mjs
          git diff --exit-code || (echo "::error::The HTML doesn't match build.mjs. Run: node .github/site/build.mjs and commit the result." && exit 1)
      - name: Links, structured data, copy rules
        run: node .github/site/check.mjs
